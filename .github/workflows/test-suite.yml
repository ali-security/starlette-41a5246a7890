---
name: Test Suite

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30

    env:
      PIP_INDEX_URL: "https://:2024-03-05T16:16:50.957686Z@time-machines-pypi.sealsecurity.io/"

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - name: "Install dependencies"
        run: "scripts/install"
      - name: "Run linting checks"
        run: "scripts/check"
      - name: "Build package & docs"
        run: "scripts/build"
      - name: "Run tests"
        run: "scripts/test ${{ inputs.test-filter }}"
      - name: "Enforce coverage"
        if: "inputs.test-filter == ''"
        run: "scripts/coverage"
      - name: "Upload distributions"
        if: "matrix.python-version == '3.11'"
        uses: "actions/upload-artifact@v4"
        with:
          name: "dist"
          path: "dist/*"
          if-no-files-found: error
